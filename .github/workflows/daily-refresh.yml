name: Daily refresh

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Refresh tool data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-tools.mjs
      - name: Commit if changed
        run: |
          git config user.name 'agentstack-bot'
          git config user.email 'bot@agentstack.dev'
          git add src/content/tools/*.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(data): daily refresh"
            git push
          fi
