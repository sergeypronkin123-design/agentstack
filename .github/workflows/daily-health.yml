name: Daily health check

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Run health check
        run: node scripts/auto-health-check.mjs
        continue-on-error: true
      - name: Commit state
        run: |
          git config user.name 'agentstack-bot'
          git config user.email 'bot@agentstack.dev'
          git add .automation/
          if ! git diff --staged --quiet; then
            git commit -m "chore(health): daily check" && git push
          fi
      - name: Open issue if broken
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const state = JSON.parse(fs.readFileSync('.automation/state.json', 'utf8'));
            const issues = state.health_issues ?? [];
            if (!issues.length) return;
            const body = issues.map(i => `- **${i.tool}** (${i.kind}): ${i.url} — ${i.status} ${i.error ?? ''}`).join('\n');
            await github.rest.issues.create({
              ...context.repo,
              title: `Health check: ${issues.length} broken URL(s)`,
              body,
              labels: ['health-check', 'automated']
            });
